<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Dashboard</title>
    <!-- Use Google Fonts for dynamic, modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- Isolation Alert Banner -->
    <div id="isolation-banner" class="alert-banner hidden">
        <span class="alert-icon">⚠️</span>
        <h2>SYSTEM IN MANUAL MODE - ISOLATED</h2>
        <p>The electrical system has been automatically isolated due to an anomaly detection.</p>
        <button id="btn-unisolate" class="btn-rescue">Bring Back from Isolation</button>
    </div>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="brand">
            <span class="logo">🛡️</span>
            <h1>Maintenance</h1>
        </div>
        <nav class="nav-links">
            <button class="nav-btn active" data-target="ids-view">IDS Control</button>
        </nav>
        <div class="system-status">
            <div id="status-indicator" class="indicator ok"></div>
            <span id="status-text">System Normal</span>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="header-bar">
            <h2>SCADA Monitoring</h2>
            <div class="clock" id="clock">00:00:00</div>
        </header>

        <!-- IDS VIEW: CONTROLS & LOGS -->
        <section id="ids-view" class="view-section active">
            <div class="ids-toolbar">
                <div class="ids-controls">
                    <label for="interface-select">Interface:</label>
                    <select id="interface-select" class="dropdown">
                        <option value="br-xyb">br-xyb (Default)</option>
                    </select>
                    <button id="btn-start-ids" class="ids-btn start">Start IDS</button>
                    <button id="btn-stop-ids" class="ids-btn stop" disabled>Stop IDS</button>
                </div>
                <div class="ids-status-badge">
                    Status: <span id="ids-status-text" class="status-offline">Stopped</span>
                </div>
            </div>

            <div class="chart-wrapper">
                <h3>Live Anomaly Score</h3>
                <div class="chart-container">
                    <canvas id="anomalyChart"></canvas>
                </div>
            </div>

            <div class="log-wrapper">
                <h3>IDS Event Log <span>(models/Isolation/ids.log)</span></h3>
                <div id="ids-log-terminal" class="terminal-box"></div>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
