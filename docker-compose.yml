

services:
  # ================= EXISTING SCADA SERVICES =================
  substation:
    build: .
    container_name: substation
    # environment:
    #   - WAZUH_MANAGER_IP=wazuh.manager
    command: ["sh", "-c", "python -u substation_rtu.py | tee -a /app/app.log"]
    ports:
      - "5002:5002"
    # depends_on:
    #   - wazuh.manager

  feeder:
    build: .
    container_name: feeder
    # environment:
    #   - WAZUH_MANAGER_IP=wazuh.manager
    command: ["sh", "-c", "python -u feeder_rtu.py | tee -a /app/app.log"]
    ports:
      - "5003:5003"
    # depends_on:
    #   - wazuh.manager
  
  home:
    build: .
    container_name: home
    environment:
      # - WAZUH_MANAGER_IP=wazuh.manager
      - FEEDER_IP=feeder
    command: ["sh", "-c", "python -u home_rtu.py | tee -a /app/app.log"]
    ports:
      - "5004:5004"
    # depends_on:
    #   - wazuh.manager

  home2:
    build: .
    container_name: home2
    environment:
      # - WAZUH_MANAGER_IP=wazuh.manager
      - FEEDER_IP=feeder
      - UNIT_ID=4
      - CONTRACT_LOAD_KW=3.0
    command: ["sh", "-c", "python -u home_rtu.py | tee -a /app/app.log"]
    ports:
      - "5005:5004"
    # depends_on:
      # - wazuh.manager

  home3:
    build: .
    container_name: home3
    environment:
      # - WAZUH_MANAGER_IP=wazuh.manager
      - FEEDER_IP=feeder
      - UNIT_ID=5
      - CONTRACT_LOAD_KW=7.0
    command: ["sh", "-c", "python -u home_rtu.py | tee -a /app/app.log"]
    ports:
      - "5006:5004"
    # depends_on:
    #   - wazuh.manager
  
  scada:
    build: .
    container_name: scada
    environment:
      - SUBSTATION_IP=substation
      - FEEDER_IP=feeder
      - HOME_IPS=home,home2,home3
      # - WAZUH_MANAGER_IP=wazuh.manager
    command: ["sh", "-c", "python -u scada_master.py | tee -a /app/app.log"]
    ports:
      - "5000:5000"
    depends_on:
      - substation
      - feeder
      - home
      # - wazuh.manager

  controller:
    build: .
    container_name: controller
    environment:
      - SUBSTATION_IP=substation
      # - WAZUH_MANAGER_IP=wazuh.manager
    command: ["python", "-u", "tempcontroller.py"]
    depends_on:
      - substation
      # - wazuh.manager
    profiles:
      - tools

  attacker_dashboard:
    build: ./attack_dashboard
    container_name: attacker_dashboard
    ports:
      - "5000:5000"
    volumes:
      - ./attack_scripts:/app/attack_scripts
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
      - attacker-net

networks:
  attacker-net:
    driver: bridge

