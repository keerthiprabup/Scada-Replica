<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCADA Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ SCADA CONTROL CENTER</h1>
            <div id="clock">00:00:00</div>
        </header>

        <main class="grid">
            <!-- GENERATION -->
            <div class="card" id="card-substation">
                <h2>🏭 Generation (Substation)</h2>
                <div class="metrics">
                    <div class="metric">
                        <span class="label">Output</span>
                        <span class="value" id="gen-mw">-- MW</span>
                    </div>
                    <div class="metric">
                        <span class="label">Temp</span>
                        <span class="value" id="gen-temp">-- °C</span>
                    </div>
                    <div class="status-box" id="gen-status">GCB: UNKNOWN</div>
                </div>
            </div>

            <!-- FEEDER -->
            <div class="card" id="card-feeder">
                <h2>🔌 Distribution (Feeder)</h2>
                <div class="metrics">
                    <div class="metric">
                        <span class="label">Load</span>
                        <span class="value" id="feeder-kw">-- kW</span>
                    </div>
                    <div class="metric">
                        <span class="label">Voltage</span>
                        <span class="value" id="feeder-v">-- V</span>
                    </div>
                    <div class="metric">
                        <span class="label">Amps</span>
                        <span class="value" id="feeder-a">-- A</span>
                    </div>
                </div>
                <div class="controls">
                    <div class="status-indicator" id="feeder-cb-status">Breaker: --</div>
                    <button class="btn btn-on" onclick="control('FEEDER', 'CLOSE')">CLOSE BREAKER</button>
                    <button class="btn btn-off" onclick="control('FEEDER', 'OPEN')">TRIP BREAKER</button>
                    <div id="feeder-alarm" class="alarm hidden">⚠️ OVERLOAD</div>
                </div>
            </div>

            <!-- HOMES GRID -->
            <div class="full-width">
                <h2>🏠 Consumers (Smart Homes)</h2>
                <div class="home-grid" id="home-container">
                    <!-- Dynamic Homes Render Here -->
                </div>
            </div>
        </main>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
